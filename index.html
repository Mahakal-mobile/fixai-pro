<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FixAI OS Pro - Luxury Hardware Intelligence</title>
    <style>
        :root {
            --os-bg: #030712;
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --luxury-gold: #fbbf24;
            --neon-blue: #38bdf8;
            --neon-green: #34d399;
            --neon-red: #f87171;
            --text-premium: #f3f4f6;
            --text-dim: #9ca3af;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at top, #0f172a, var(--os-bg));
            color: var(--text-premium);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .os-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .os-logo {
            font-size: 24px;
            background: linear-gradient(135deg, var(--luxury-gold), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .lang-toggle {
            background: rgba(251, 191, 36, 0.1);
            color: var(--luxury-gold);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lang-toggle:hover {
            background: var(--luxury-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }
        .os-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInOS 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeInOS {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .android-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 15px;
        }
        .app-icon-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        .app-icon-box:hover {
            border-color: var(--luxury-gold);
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 35px rgba(251, 191, 36, 0.15);
        }
        .icon-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .app-icon-box:hover .icon-circle {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-color: var(--luxury-gold);
            transform: rotate(5deg);
        }
        .app-icon-box h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--text-premium);
        }
        .os-card {
            display: none;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 22px;
            margin-top: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUpOS 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUpOS {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .os-back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-premium);
            padding: 12px 22px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 22px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .os-back-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-premium);
        }
        .luxury-panel {
            width: 100%;
            height: 260px;
            background: #020408;
            border-radius: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .scan-laser {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--luxury-gold), transparent);
            top: 0;
            animation: luxuryScan 2.5s ease-in-out infinite;
            display: none;
            box-shadow: 0 0 10px var(--luxury-gold);
        }
        @keyframes luxuryScan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .fault-glow {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 3px solid var(--neon-red);
            border-radius: 50%;
            background: rgba(248,113,113,0.2);
            display: none;
            box-shadow: 0 0 20px var(--neon-red);
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.25); opacity: 0.3; }
        }
        .luxury-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--luxury-gold), #d97706);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(251,191,36,0.25);
            transition: all 0.3s;
        }
        .luxury-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251,191,36,0.4);
        }
        .terminal-screen {
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            height: 240px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.6;
        }
        .luxury-input-group {
            display: flex;
            gap: 12px;
        }
        .luxury-input-group input {
            flex: 1;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 14px;
            font-size: 15px;
            transition: 0.3s;
        }
        .luxury-input-group input:focus {
            outline: none;
            border-color: var(--luxury-gold);
            box-shadow: 0 0 10px rgba(251,191,36,0.15);
        }
        .luxury-input-group button {
            padding: 0 25px;
            background: linear-gradient(135deg, var(--neon-blue), #0284c7);
            border: none;
            color: #fff;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56,189,248,0.2);
        }
        select {
            width: 100%;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .ai-card-report {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 15px;
            border-radius: 16px;
            margin-top: 15px;
            border-left: 5px solid var(--neon-blue);
        }
        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
